<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">

    <!-- 헤더 -->
    <header class="header">
      <div class="header-brand">
        <div class="brand-dot"></div>
        <span class="brand-name">JARVIS</span>
      </div>
      <a href="../options/options.html" target="_blank" class="settings-btn" title="설정">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65
                   0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9
                   19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0
                   0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65
                   1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a
                   1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0
                   0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65
                   0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </a>
    </header>

    <!-- 단계 표시기 -->
    <div class="steps-bar" id="stepsBar">
      <div class="step active" data-step="0">
        <div class="step-dot"></div>
        <span class="step-label">대기</span>
      </div>
      <div class="step-line"></div>
      <div class="step" data-step="1">
        <div class="step-dot"></div>
        <span class="step-label">듣는 중</span>
      </div>
      <div class="step-line"></div>
      <div class="step" data-step="2">
        <div class="step-dot"></div>
        <span class="step-label">분석 중</span>
      </div>
      <div class="step-line"></div>
      <div class="step" data-step="3">
        <div class="step-dot"></div>
        <span class="step-label">실행 완료</span>
      </div>
    </div>

    <!-- 예시 힌트 -->
    <div class="examples-bar">
      <span class="examples-prefix">예시</span>
      <span class="example-text" id="exampleText">"유튜브 열어줘"</span>
    </div>

    <!-- 백그라운드 탭 안내 배너 (첫 실행 시 한 번만 표시) -->
    <div class="info-banner hidden" id="infoBanner">
      <span class="info-banner-text">💡 새 탭은 백그라운드로 열립니다. 명령 완료 후 탭을 확인하세요.</span>
      <button class="info-banner-close" id="infoBannerClose" aria-label="닫기">×</button>
    </div>

    <!-- 마이크 섹션 -->
    <div class="mic-section">
      <div class="mic-wrapper">
        <div class="mic-pulse-ring" id="micPulseRing"></div>
        <button class="mic-btn" id="micBtn" aria-label="음성 녹음 시작">
          <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
      </div>
      <canvas class="waveform-canvas hidden" id="waveformCanvas"></canvas>
      <p class="mic-hint" id="micHint">버튼을 눌러 말하세요</p>
    </div>

    <!-- 텍스트 명령 입력 -->
    <div class="text-divider">
      <span class="divider-line"></span>
      <span class="divider-text">또는</span>
      <span class="divider-line"></span>
    </div>

    <div class="text-input-row">
      <input type="text" class="text-cmd-input" id="textCmdInput"
             placeholder="여기에 명령을 입력하세요" autocomplete="off" />
      <button class="text-cmd-btn" id="textCmdBtn" aria-label="명령 실행">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>

    <!-- 인식된 텍스트 카드 -->
    <div class="result-card hidden" id="transcriptCard">
      <span class="card-label">인식된 텍스트</span>
      <p class="card-text" id="transcriptText"></p>
    </div>

    <!-- 실행 액션 카드 -->
    <div class="result-card action-card hidden" id="actionCard">
      <div class="action-bar"></div>
      <div class="action-body">
        <span class="card-label">실행 액션</span>
        <p class="action-intent-label" id="actionLabel"></p>
        <p class="action-result-msg hidden" id="actionResult"></p>
        <p class="action-raw" id="actionRaw"></p>
      </div>
    </div>

    <!-- 에러 카드 -->
    <div class="result-card error-card hidden" id="errorCard">
      <span class="card-label">오류</span>
      <p class="card-text error-text" id="errorContent"></p>
    </div>

    <!-- 히스토리 섹션 -->
    <div class="history-section hidden" id="historySection">
      <div class="history-header">
        <span class="history-title">최근 명령</span>
        <button class="history-clear-btn" id="historyClearBtn">지우기</button>
      </div>
      <ul class="history-list" id="historyList"></ul>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
