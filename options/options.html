<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Browser 설정</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      background: #0f0f13;
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .page {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* ── 헤더 ── */
    .page-header h1 {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #059669, #34D399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .page-header p {
      margin-top: 6px;
      font-size: 13px;
      color: #6b7280;
    }

    /* ── 카드 ── */
    .card {
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #6b7280;
      border-bottom: 1px solid #2a2a3a;
      padding-bottom: 10px;
    }

    /* ── 안내 텍스트 ── */
    .info-text {
      font-size: 15px;
      color: #c4c4d4;
      line-height: 1.7;
    }

    .info-icon {
      font-size: 32px;
      text-align: center;
    }

    /* ── 서버 상태 배지 ── */
    .server-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #0d2418;
      border: 1px solid #065f46;
      border-radius: 8px;
      font-size: 13px;
      color: #34D399;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #10B981;
      border-radius: 50%;
      flex-shrink: 0;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* ── 주의사항 ── */
    .notice {
      padding: 12px 14px;
      background: #0e1a2e;
      border: 1px solid #1e3a5f;
      border-radius: 10px;
      font-size: 12px;
      color: #93c5fd;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="page">

    <header class="page-header">
      <h1>⚙️ Voice Browser 설정</h1>
      <p>Voice Browser 확장 프로그램 정보</p>
    </header>

    <!-- 안내 카드 -->
    <div class="card">
      <div class="card-title">서버 연동 방식</div>

      <div class="info-icon">🖥️</div>

      <p class="info-text">
        이 확장은 <strong>백엔드 서버</strong>를 통해 작동합니다.<br>
        별도의 API 키 설정이 필요하지 않습니다.
      </p>

      <p class="info-text" style="font-size:13px; color:#6b7280;">
        음성 인식(Whisper), 명령 해석(Claude), YouTube 검색에 필요한
        API 키는 모두 서버에서 안전하게 관리됩니다.
      </p>

      <div class="server-badge">
        <span class="dot"></span>
        백엔드 서버 연결됨 — voice-browser-backend-youngho.vercel.app
      </div>
    </div>

    <!-- 안내 -->
    <div class="notice">
      ℹ️ 문제가 발생하면 인터넷 연결 상태를 확인하거나, 잠시 후 다시 시도해주세요.
    </div>

  </div>
</body>
</html>
